<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>滴定実験シミュレーション</title><link rel="stylesheet" href="style.css">
<style>
body{overflow-x:hidden}.titration-layout{display:grid;grid-template-columns:1.7fr 1fr;min-height:590px;background:#1e1e24}.stage{position:relative;min-height:590px;background:#16161a;border-right:1px solid #2d2d38;overflow:hidden}.stage:before{content:'LAB 01';position:absolute;left:18px;top:16px;color:#33333f;font-size:12px;letter-spacing:.2em}.bench{position:absolute;left:8%;right:8%;bottom:40px;height:18px;background:#2c2c35;border:1px solid #444450;border-radius:4px}.stand-base{position:absolute;left:15%;bottom:40px;width:18px;height:280px;background:#3b3b45;border:1px solid #555564}.stand-foot{position:absolute;left:9%;bottom:28px;width:30%;height:18px;background:#33333d;border:1px solid #50505c;border-radius:5px}.burette{position:absolute;left:46%;top:55px;width:30px;height:290px;border:2px solid #8c96a7;border-radius:4px 4px 12px 12px;background:rgba(180,230,255,.04);z-index:4}.burette .liquid{position:absolute;left:4px;right:4px;bottom:4px;height:245px;background:rgba(160,220,255,.35);border-radius:0 0 8px 8px}.scale{position:absolute;right:-29px;top:20px;height:240px;width:24px;color:#777;font-size:8px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 11px,#555 11px,#555 12px)}.stopcock{position:absolute;left:calc(46% - 18px);top:330px;width:66px;height:20px;background:#555563;border:2px solid #777787;border-radius:8px;z-index:5}.stopcock:after{content:'';position:absolute;right:-16px;top:5px;width:30px;height:8px;background:#777787;border-radius:4px;transform:rotate(-18deg)}.drop{position:absolute;left:calc(46% + 11px);top:352px;width:7px;height:13px;border-radius:50%;background:#b5f6ff;opacity:0}.drop.on{animation:fall .28s linear infinite}@keyframes fall{0%{transform:translateY(0);opacity:1}100%{transform:translateY(170px);opacity:0}}.beaker{position:absolute;left:calc(46% - 47px);bottom:82px;width:125px;height:115px;border:3px solid rgba(255,255,255,.6);border-top:0;border-radius:0 0 16px 16px;z-index:3}.beaker-liquid{position:absolute;left:4px;right:4px;bottom:4px;height:44px;background:#ffd700;border-radius:0 0 11px 11px;transition:.2s}.panel{padding:25px;display:flex;flex-direction:column;gap:18px}.panel h2{font-size:18px;margin:0}.instruction{padding:12px;border:1px solid #2d2d38;background:#16161a;border-radius:9px;color:#9999a6;font-size:12px;line-height:1.7}.knob-area{display:grid;place-items:center}.knob{width:130px;height:130px;border-radius:50%;background:#121215;border:2px solid #3a3a4a;display:grid;place-items:center}.knob-handle{width:82px;height:18px;border-radius:9px;background:#747482;border:2px solid #9a9aa7;transform-origin:center;cursor:grab;touch-action:none}.knob-handle:after{content:'';display:block;width:20px;height:20px;background:#aeb0bd;border-radius:50%;margin-top:-3px;margin-left:29px}.info{background:#16161a;border:1px solid #2d2d38;border-radius:10px;padding:14px}.row{display:flex;justify-content:space-between;margin:0 0 10px;color:#9999a6;font-size:13px}.row:last-child{margin-bottom:0}.val{color:#fff;font-weight:800}.status{padding:3px 8px;border-radius:5px;font-weight:800;background:#e6c200;color:#000}.finish{width:100%;padding:12px;border:1px solid #4a90e2;background:#2677cc;color:#fff;border-radius:8px;font-weight:800}.finish:disabled{opacity:.35;cursor:not-allowed}.target{font-size:11px;color:#666673;text-align:center}
@media(max-width:760px){.titration-layout{grid-template-columns:1fr}.stage{min-height:460px;border-right:0;border-bottom:1px solid #2d2d38}.panel{min-height:470px}.burette{left:48%}.stopcock{left:calc(48% - 18px)}.drop{left:calc(48% + 11px)}.beaker{left:calc(48% - 47px)}}
</style></head><body><div class="app-bg"><div class="game-page"><div class="game-frame">
<header class="game-header"><div><a class="back-btn" href="index.html">← トップへ</a></div><h1>滴定実験シミュレーション</h1><div class="level">Lv.<span data-player-level>1</span></div></header>
<div class="notice">コックを上下にドラッグして滴下量を調整し、中和点（10.00 mL付近）を狙ってください。</div>
<div class="titration-layout"><section class="stage"><div class="stand-base"></div><div class="stand-foot"></div><div class="burette"><div id="burette-liquid" class="liquid"></div><div class="scale"></div></div><div id="stopcock" class="stopcock"></div><div id="drop" class="drop"></div><div class="beaker"><div id="beaker-liquid" class="beaker-liquid"></div></div><div class="bench"></div></section>
<section class="panel"><h2>コック操作パネル</h2><div class="instruction">上下ドラッグでコックを開きます。<br>橙色になったら中和点付近です。</div><div class="knob-area"><div class="knob"><div id="knob-handle" class="knob-handle"></div></div></div><div class="info"><div class="row"><span>コック開度</span><span id="angle" class="val">0°</span></div><div class="row"><span>滴下量</span><span id="volume" class="val">0.00 mL</span></div><div class="row"><span>液体の色</span><span id="status" class="status">黄色</span></div></div><button id="finish" class="finish">実験を終了して採点</button><div class="target">目標：10.00 mL</div></section></div></div></div></div>
<div id="result" class="result-overlay"><div class="result-modal"><div class="result-icon">⚗</div><h2 id="result-title">実験クリア！</h2><div class="result-score" id="result-score">85点</div><div class="result-exp" id="result-exp">+68 EXP</div><p id="result-detail" style="color:#9999a6;font-size:12px"></p><div class="modal-actions"><a href="index.html" class="primary">トップへ戻る</a><button onclick="location.reload()">もう一度</button></div></div></div>
<div id="levelup" class="level-up"><div class="level-up-box"><div class="level-up-label">LEVEL UP</div><div class="level-up-number" id="level-number">Lv.2</div><button id="level-close">続ける</button></div></div>
<script src="game-data.js"></script><script>
ChemistryGame.renderHeader();
const knob=document.getElementById('knob-handle'), liquid=document.getElementById('burette-liquid'), beaker=document.getElementById('beaker-liquid'), drop=document.getElementById('drop'), angleEl=document.getElementById('angle'), volumeEl=document.getElementById('volume'), statusEl=document.getElementById('status'), finish=document.getElementById('finish');
let dragging=false,startY=0,startAngle=0,angle=0,buretteHeight=245,beakerHeight=44,volume=0,ended=false;
function updateVisual(){knob.style.transform=`rotate(${angle}deg)`;angleEl.textContent=Math.round(angle)+'°';if(angle>0&&!ended)drop.classList.add('on');else drop.classList.remove('on');if(volume<9.8){beaker.style.background='#ffd700';statusEl.textContent='黄色';statusEl.style.background='#e6c200';statusEl.style.color='#000';}else if(volume<=10.2){beaker.style.background='#ff8c00';statusEl.textContent='橙色（中和点！）';statusEl.style.background='#ff8c00';statusEl.style.color='#fff';}else{beaker.style.background='#ff3344';statusEl.textContent='赤色';statusEl.style.background='#ff3344';statusEl.style.color='#fff';}}
function pointerStart(e){if(ended)return;e.preventDefault();dragging=true;startY=e.clientY;startAngle=angle;knob.setPointerCapture?.(e.pointerId)}
function pointerMove(e){if(!dragging)return;const delta=e.clientY-startY;angle=Math.max(0,Math.min(90,startAngle+delta));updateVisual()}
function pointerEnd(){dragging=false}
knob.addEventListener('pointerdown',pointerStart);knob.addEventListener('pointermove',pointerMove);knob.addEventListener('pointerup',pointerEnd);knob.addEventListener('pointercancel',pointerEnd);
setInterval(()=>{if(ended||angle<=0||buretteHeight<=0)return;const flow=(angle/90)*0.08;buretteHeight=Math.max(0,buretteHeight-flow*5);beakerHeight=Math.min(100,beakerHeight+flow*1.5);volume+=flow;liquid.style.height=buretteHeight+'px';beaker.style.height=beakerHeight+'px';volumeEl.textContent=volume.toFixed(2)+' mL';updateVisual();},30);
finish.addEventListener('click',()=>{if(ended)return;ended=true;angle=0;updateVisual();finish.disabled=true;const error=Math.abs(volume-10);const score=Math.max(0,Math.round(100-error*25));const exp=Math.round(score*.8);const r=ChemistryGame.complete('titration',score,exp);showResult(r,`中和点との差は ${error.toFixed(2)} mL でした。`);});
function showResult(r,detail){document.getElementById('result-score').textContent=r.score+'点';document.getElementById('result-exp').textContent=r.expGain>0?`+${r.expGain} EXP`:'EXP獲得なし（最高記録を更新しませんでした）';document.getElementById('result-detail').textContent=detail+(r.isNewBest?' 最高記録を更新！':'');document.getElementById('result').style.display='grid';if(r.afterLevel>r.beforeLevel){document.getElementById('level-number').textContent='Lv.'+r.afterLevel;document.getElementById('levelup').style.display='grid';}}
document.getElementById('level-close').onclick=()=>document.getElementById('levelup').style.display='none';
</script></body></html>
