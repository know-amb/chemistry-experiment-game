<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>滴定実験レポート作成 - 考察</title><link rel="stylesheet" href="style.css">
<style>
.report-wrap{padding:24px}.question{background:#16161a;border:1px solid #2d2d38;border-radius:12px;padding:20px}.question h2{font-size:18px;color:#4a90e2;margin:0 0 18px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.option{min-height:145px;border:1px solid #383844;background:#111116;border-radius:10px;padding:16px;display:grid;place-items:center;text-align:center;color:#ddd;cursor:pointer;transition:.18s}.option:hover{border-color:#4a90e2}.option.selected{border-color:#4a90e2;background:#182538;box-shadow:0 0 0 1px #4a90e2 inset}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.step{color:#777783;font-size:11px}.next{background:#2677cc;border:1px solid #4a90e2;color:#fff;border-radius:8px;padding:10px 18px;font-weight:800}.next:disabled{opacity:.35;cursor:not-allowed}.report-page{display:none;background:#0d0d10;border:1px solid #2d2d38;border-radius:10px;padding:18px;color:#55e486;font-family:'Courier New',monospace;white-space:pre-wrap;line-height:1.65;font-size:12px;max-height:430px;overflow:auto}.stamp{display:none;margin:16px auto 0;width:110px;height:110px;border:4px double #ff4d4d;border-radius:50%;align-items:center;justify-content:center;flex-direction:column;color:#ff4d4d;transform:rotate(-10deg);font-weight:900}.stamp.show{display:flex}.stamp strong{font-size:38px;line-height:1}.stamp small{font-size:9px;letter-spacing:.12em}.graph{height:180px;border:1px solid #30303c;border-radius:9px;background:#111116;position:relative;overflow:hidden;margin-bottom:14px}.graph:before,.graph:after{content:'';position:absolute;background:#292934}.graph:before{left:45px;right:15px;bottom:35px;height:1px}.graph:after{left:45px;top:20px;bottom:35px;width:1px}.curve{position:absolute;left:55px;right:20px;bottom:35px;height:110px;border-bottom:3px solid transparent;border-right:3px solid transparent}.curve svg{width:100%;height:100%}
@media(max-width:650px){.report-wrap{padding:12px}.options{grid-template-columns:1fr}.option{min-height:85px}.graph{height:150px}}
</style></head><body><div class="app-bg"><div class="game-page"><div class="game-frame">
<header class="game-header"><a class="back-btn" href="index.html">← トップへ</a><h1>滴定実験レポート作成 - 考察</h1><div class="level">Lv.<span data-player-level>1</span></div></header><div class="notice">3問に答えて実験結果を考察し、レポートを完成させましょう。</div>
<main class="report-wrap"><div id="questions"></div><div id="report" class="report-page"></div><div id="stamp" class="stamp"><strong id="rank">S</strong><small id="rankText">EXCELLENT</small></div></main>
</div></div></div>
<div id="result" class="result-overlay"><div class="result-modal"><div class="result-icon">📝</div><h2 id="result-title">レポート完成！</h2><div class="result-score" id="score">100点</div><div class="result-exp" id="exp">+80 EXP</div><p id="detail" style="color:#9999a6;font-size:12px"></p><div class="modal-actions"><a href="index.html" class="primary">トップへ戻る</a><button onclick="location.reload()">もう一度</button></div></div></div>
<div id="levelup" class="level-up"><div class="level-up-box"><div class="level-up-label">LEVEL UP</div><div class="level-up-number" id="level-number">Lv.2</div><button id="level-close">続ける</button></div></div>
<script src="game-data.js"></script><script>
ChemistryGame.renderHeader();
const qs=[{title:'問1. この実験のpH変化を表すグラフはどれ？',options:['グラフA（直線）','グラフB（S字曲線）','グラフC（波形）'],answer:1},{title:'問2. 数滴で色が急激に変化した理由は？',options:['液の温度が上昇したため','pHジャンプが起きたため','指示薬が蒸発したため'],answer:1},{title:'問3. 滴定の技術は生活のどこで役立つ？',options:['食品の酸度チェック','金属の硬度測定','電気の電圧測定'],answer:0}];let step=0,answers=[];
function renderQuestion(){const q=qs[step];document.getElementById('questions').innerHTML=`<section class="question"><h2>${q.title}</h2>${step===0?'<div class="graph"><div class="curve"><svg viewBox="0 0 500 120" preserveAspectRatio="none"><path d="M5,105 C100,103 170,100 215,93 C250,88 265,78 275,60 C282,35 286,15 300,10 C345,4 410,3 495,2" fill="none" stroke="#4a90e2" stroke-width="4"/></svg></div></div>':''}<div class="options">${q.options.map((o,i)=>`<div class="option" data-i="${i}">${o}</div>`).join('')}</div><div class="nav"><span class="step">STEP ${step+1} / 3</span><button class="next" id="next" disabled>${step===2?'レポート作成':'次へ進む'}</button></div></section>`;document.querySelectorAll('.option').forEach(el=>el.onclick=()=>{document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');answers[step]=+el.dataset.i;document.getElementById('next').disabled=false});document.getElementById('next').onclick=()=>{if(step<2){step++;renderQuestion()}else generateReport()}}
renderQuestion();
function generateReport(){document.getElementById('questions').style.display='none';document.querySelector('.notice').textContent='実験レポート出力結果';const graphAns=answers[0]===1?'グラフB（S字曲線）':`グラフ${String.fromCharCode(65+answers[0])}`;const reasonAns=answers[1]===1?'中和点付近での急激なpHジャンプ':'液の物理的変化';const lifeAns=answers[2]===0?'食品（お酢や果汁）の酸度測定・品質管理':'各種工業的測定';const text=`================================================\n            化学実験報告書（中和滴定）\n================================================\n\n【目的】\n水酸化ナトリウム溶液を塩酸溶液で滴定し、指示薬（メチルオレンジ）の変色域および中和反応の概要を理解する。\n\n【実験器具】\nビュレット、コック、ビーカー、スポイト、メチルオレンジ指示薬\n\n【実験操作】\n1. ビーカーに未知の溶液を用意する。\n2. コックを操作し、ビュレットから溶液を少しずつ滴下する。\n3. 指示薬の色の変化（黄色→橙色→赤色）を観察する。\n\n【実験結果】\n・滴下量：10.00 mL 付近で色の変化を確認。\n・中和における指示薬の色：橙色\n\n【考察】\n1. pH変化の挙動：\n   本実験における水溶液のpH変化は「${graphAns}」の挙動を示した。\n\n2. 急激な変色理由：\n   中和点付近にて「${reasonAns}」が発生するため、わずかな滴下量で劇的な変色が観察された。\n\n3. 生活への応用・展開：\n   本実験で用いた濃度決定技術（滴定）は、身近な「${lifeAns}」など幅広く活用されている。\n\n================================================\nEND OF REPORT\n================================================`;
const box=document.getElementById('report');box.style.display='block';let i=0;function type(){if(i<text.length){box.textContent+=text[i++];box.scrollTop=box.scrollHeight;setTimeout(type,7)}else finish()}type();}
function finish(){let correct=answers.reduce((n,a,i)=>n+(a===qs[i].answer?1:0),0);let score=[25,50,75,100][correct];let exp=Math.round(score*.8);let rank=score===100?'S':score>=75?'A':'B';document.getElementById('rank').textContent=rank;document.getElementById('rankText').textContent=rank==='S'?'EXCELLENT':rank==='A'?'GREAT':'GOOD';document.getElementById('stamp').style.color=rank==='S'?'#ff4d4d':rank==='A'?'#ffcc00':'#4cd964';document.getElementById('stamp').style.borderColor=document.getElementById('stamp').style.color;document.getElementById('stamp').classList.add('show');const r=ChemistryGame.complete('report',score,exp);document.getElementById('result-title').textContent=score>=60?'レポート完成！':'未クリア';document.getElementById('score').textContent=score+'点';document.getElementById('exp').textContent=r.expGain>0?`+${r.expGain} EXP`:'EXP獲得なし（最高記録を更新しませんでした）';document.getElementById('detail').textContent=`正解 ${correct} / 3　評価 ${rank}${r.isNewBest?'　最高記録を更新！':''}`;document.getElementById('result').style.display='grid';if(r.afterLevel>r.beforeLevel){document.getElementById('level-number').textContent='Lv.'+r.afterLevel;document.getElementById('levelup').style.display='grid';}}
document.getElementById('level-close').onclick=()=>document.getElementById('levelup').style.display='none';
</script></body></html>
