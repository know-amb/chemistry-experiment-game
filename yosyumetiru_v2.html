<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>指示薬クイズ - メチルオレンジ</title><link rel="stylesheet" href="style.css">
<style>
.quiz{padding:24px}.lab-stage{background:#16161a;border:1px solid #2d2d38;border-radius:12px;padding:22px}.quiz-title{text-align:center;font-size:22px;font-weight:800;margin:0 0 6px}.quiz-sub{text-align:center;color:#888894;font-size:12px;margin-bottom:20px}.beaker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:700px;margin:auto}.beaker-card{background:#111116;border:1px solid #333340;border-radius:12px;padding:16px;text-align:center}.beaker-label{font-weight:800;margin-top:10px;color:#bbb}.beaker{width:100px;height:120px;margin:0 auto;position:relative;border:3px solid rgba(255,255,255,.55);border-top:0;border-radius:0 0 16px 16px}.liquid{position:absolute;left:5px;right:5px;bottom:5px;height:55px;border-radius:0 0 11px 11px;background:rgba(255,255,255,.08);transition:.25s}.pipette{width:24px;height:95px;border:3px solid #aaa;border-radius:3px 3px 12px 12px;margin:0 auto 12px;position:relative}.pipette:before{content:'';position:absolute;top:-14px;left:4px;width:10px;height:15px;background:#777;border-radius:3px}.pipette:after{content:'';position:absolute;bottom:-18px;left:8px;width:4px;height:20px;background:#aaa}.answer-panel{margin-top:18px;background:#16161a;border:1px solid #2d2d38;border-radius:12px;padding:18px}.select-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.select-box{background:#111116;border:1px solid #30303c;border-radius:9px;padding:12px}.select-box label{display:block;font-size:11px;color:#9999a6;margin-bottom:7px}.select-box select{width:100%;background:#24242c;color:#fff;border:1px solid #484856;border-radius:7px;padding:9px}.submit-btn{width:100%;margin-top:14px;background:#ff8c00;border:1px solid #ff9e26;color:#fff;padding:12px;border-radius:8px;font-weight:800}.result-message{text-align:center;min-height:20px;margin-top:10px;font-weight:800}.shuffle{display:block;margin:18px auto 0;background:#202028;border:1px solid #3d3d49;color:#ddd;padding:8px 14px;border-radius:7px;font-size:12px}.hidden-color{filter:saturate(.05)}
@media(max-width:650px){.beaker-grid,.select-grid{grid-template-columns:1fr}.beaker-grid{gap:10px}.quiz{padding:12px}.lab-stage{padding:14px}}
</style></head><body><div class="app-bg"><div class="game-page"><div class="game-frame">
<header class="game-header"><a class="back-btn" href="index.html">← トップへ</a><h1>指示薬クイズ - メチルオレンジ</h1><div class="level">Lv.<span data-player-level>1</span></div></header>
<div class="notice">3つのビーカーに入っている液体の性質を、メチルオレンジの色から見分けてください。</div>
<main class="quiz"><section class="lab-stage"><h2 class="quiz-title">実験：メチルオレンジで中身をあてよう！</h2><div class="quiz-sub">スポイトを使って、それぞれの液体の色を確認します。</div><div class="beaker-grid" id="beakers"></div><button class="shuffle" id="shuffle">別の問題にする</button></section>
<section class="answer-panel"><div class="select-grid"><div class="select-box"><label>酸性（赤）はどれ？</label><select id="acid"><option value="">選択...</option><option value="0">ビーカー A</option><option value="1">ビーカー B</option><option value="2">ビーカー C</option></select></div><div class="select-box"><label>中性（橙）はどれ？</label><select id="neutral"><option value="">選択...</option><option value="0">ビーカー A</option><option value="1">ビーカー B</option><option value="2">ビーカー C</option></select></div><div class="select-box"><label>塩基性（黄）はどれ？</label><select id="alkali"><option value="">選択...</option><option value="0">ビーカー A</option><option value="1">ビーカー B</option><option value="2">ビーカー C</option></select></div></div><div id="message" class="result-message"></div><button id="submit" class="submit-btn">答え合わせ！</button></section></main>
</div></div></div>
<div id="result" class="result-overlay"><div class="result-modal"><div class="result-icon">🧪</div><h2 id="result-title">クイズクリア！</h2><div class="result-score" id="score">0点</div><div class="result-exp" id="exp">+0 EXP</div><p id="detail" style="color:#9999a6;font-size:12px"></p><div class="modal-actions"><a href="index.html" class="primary">トップへ戻る</a><button onclick="location.reload()">もう一度</button></div></div></div>
<div id="levelup" class="level-up"><div class="level-up-box"><div class="level-up-label">LEVEL UP</div><div class="level-up-number" id="level-number">Lv.2</div><button id="level-close">続ける</button></div></div>
<script src="game-data.js"></script><script>
ChemistryGame.renderHeader();const beakersEl=document.getElementById('beakers'),message=document.getElementById('message');let contents=[];
const defs={acid:{name:'酸性',color:'#ff4d4d'},neutral:{name:'中性',color:'#ff8c00'},alkali:{name:'塩基性',color:'#ffd700'}};
function shuffle(){contents=['acid','neutral','alkali'].sort(()=>Math.random()-.5);beakersEl.innerHTML='';contents.forEach((type,i)=>{const d=document.createElement('div');d.className='beaker-card';d.innerHTML=`<div class="pipette"></div><div class="beaker"><div class="liquid hidden-color" id="liquid-${i}"></div></div><div class="beaker-label">ビーカー ${String.fromCharCode(65+i)}</div>`;beakersEl.appendChild(d)});message.textContent='';document.querySelectorAll('select').forEach(s=>s.value='');setTimeout(()=>{contents.forEach((type,i)=>{const el=document.getElementById('liquid-'+i);el.classList.remove('hidden-color');el.style.background=defs[type].color;});},250)}
shuffle();document.getElementById('shuffle').onclick=shuffle;
document.getElementById('submit').onclick=()=>{const ans={acid:+document.getElementById('acid').value,neutral:+document.getElementById('neutral').value,alkali:+document.getElementById('alkali').value};if(Object.values(ans).some(Number.isNaN)){message.textContent='3つすべて選択してください。';message.style.color='#ffcc66';return}let correct=0;if(contents[ans.acid]==='acid')correct++;if(contents[ans.neutral]==='neutral')correct++;if(contents[ans.alkali]==='alkali')correct++;const score=[10,40,70,100][correct];const exp=Math.round(score*.8);const r=ChemistryGame.complete('indicator',score,exp);document.getElementById('result-title').textContent=score>=60?'クイズクリア！':'クイズ未クリア';document.getElementById('score').textContent=score+'点';document.getElementById('exp').textContent=r.expGain>0?`+${r.expGain} EXP`:'EXP獲得なし（最高記録を更新しませんでした）';document.getElementById('detail').textContent=`正解 ${correct} / 3${r.isNewBest?'　最高記録を更新！':''}`;document.getElementById('result').style.display='grid';if(r.afterLevel>r.beforeLevel){document.getElementById('level-number').textContent='Lv.'+r.afterLevel;document.getElementById('levelup').style.display='grid';}};
document.getElementById('level-close').onclick=()=>document.getElementById('levelup').style.display='none';
</script></body></html>
